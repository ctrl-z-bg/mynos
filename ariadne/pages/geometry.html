<!DOCTYPE html>
<title>Geometry</title>
<style>
  #box { width: 200px; height: 100px; border: 5px solid #1a5fb4; padding: 10px; color: rgb(10, 20, 30) }
  #rel { position: relative; margin-left: 40px; padding: 8px }
  #far { margin-top: 2000px; height: 50px; background: #2ec27e }
  #status { position: sticky }
</style>
<h1>Geometry</h1>
<div id="box">A box: 200 x 100, padding 10, border 5</div>
<p>Some text and <span id="sp">an inline span</span> in a line.</p>
<div id="rel"><div id="child">a child of a positioned div</div></div>
<pre id="out">(not run)</pre>
<p id="io">the box below: (not observed)</p>
<p id="sc">scroll events: 0</p>
<div id="far">far below</div>
<script>
const $ = id => document.getElementById(id);
const r = $("box").getBoundingClientRect();
const s = $("sp").getBoundingClientRect();
const cs = getComputedStyle($("box"));
$("out").textContent = [
  "box: offsetWidth " + $("box").offsetWidth + " (230), offsetHeight " + $("box").offsetHeight + " (130)",
  "box: clientWidth " + $("box").clientWidth + " (220), rect width " + r.width + ", top " + Math.round(r.top),
  "span: width " + Math.round(s.width) + " (more than 0), height " + Math.round(s.height),
  "child: offsetParent " + $("child").offsetParent.id + " (rel), offsetTop " + $("child").offsetTop + " (8)",
  "computed: display " + cs.display + ", color " + cs.color + ", width " + cs.width,
  "viewport: " + innerWidth + " x " + innerHeight + ", page " + document.documentElement.scrollHeight + " high"
].join("\n");
let n = 0, seen = "not observed";
const report = () => {
  $("io").textContent = "the box below: " + seen;
  $("sc").textContent = "scroll events: " + n;
  $("far").textContent = "far below: " + seen + "; scroll events: " + n;
};
window.addEventListener("scroll", () => { n++; report(); });
new IntersectionObserver(es => es.forEach(e => {
  seen = e.isIntersecting ? "in view" : "not in view";
  report();
})).observe($("far"));
</script>
